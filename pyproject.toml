[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qualitypilot-lite"
version = "0.1.0"
description = "Reproducible industrial visual anomaly detection experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6", "Pillow==11.3.0", "scikit-learn==1.7.2",
  "pandas==2.3.3", "matplotlib==3.10.7", "PyYAML==6.0.3", "joblib==1.5.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.2"]
ml = ["anomalib==2.2.0", "torch==2.8.0", "torchvision==0.23.0",
      "lightning==2.5.5", "torchmetrics==1.8.2", "timm==1.0.20",
      "opencv-python==4.12.0.88", "requests==2.32.5", "huggingface-hub==0.36.0"]
ui = ["streamlit==1.50.0"]

[project.scripts]
qualitypilot = "qualitypilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real locally available model and data; no implicit downloads"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "ml" }]
torchvision = [{ index = "pytorch-cu128", extra = "ml" }]
