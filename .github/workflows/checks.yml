name: checks
on: [push, pull_request]
jobs:
  baseline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
  ui:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,ui]"
      - name: Require Streamlit and an environment without ML
        run: python -c "import importlib.util, streamlit; assert importlib.util.find_spec('torch') is None"
      - name: Run UI regressions without skips
        run: python -m pytest tests/test_ui_data.py tests/test_ui_app.py --junitxml=ui-tests.xml
      - name: Require executed UI tests
        run: python -c "import xml.etree.ElementTree as E; suites = list(E.parse('ui-tests.xml').getroot().iter('testsuite')); assert sum(int(s.attrib['tests']) for s in suites) > 0; assert sum(int(s.attrib.get('skipped', 0)) for s in suites) == 0"
